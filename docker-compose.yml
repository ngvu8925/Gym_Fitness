services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym-fitness-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-GymFitness@2026!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - gym_mssql_data:/var/opt/mssql
      - ./Database:/scripts:ro

volumes:
  gym_mssql_data:
